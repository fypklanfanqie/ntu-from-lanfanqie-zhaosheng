		}

		#dify-chatbot-bubble-button {

			box-shadow: none !important;

			height: 170px !important;
			position: fixed !important;
			/* 默认 fallback，JS 将覆盖为 left/top */

			right: 20px !important;
			z-index: 2147483647 !important;
			cursor: grab !important;
			filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.15));
			overflow: visible !important;
			transition: filter 0.3s ease;
		}

		#dify-chatbot-bubble-button:active {
			cursor: grabbing !important;
		}

		#dify-chatbot-bubble-button:hover:not(.dragging) {
			filter: drop-shadow(0 0 25px rgba(79, 172, 254, 0.6)) brightness(1.08);
		}

		#dify-chatbot-bubble-button::after {
			content: "👋 嗨！我是睿宝 \A 咨询人数较多，请耐心等待~";
			white-space: pre;
			position: absolute;
			top: 10px;
			right: 130px;
			background: rgba(255, 255, 255, 0.95);
			color: #444;
			padding: 12px 16px;
			border-radius: 12px;
			border-bottom-right-radius: 4px;
			box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
			border: 1px solid rgba(255, 255, 255, 0.8);
			backdrop-filter: blur(5px);
			font-size: 13px;
			font-weight: 600;
			pointer-events: none;
			opacity: 0;
			transform: translateX(10px) scale(0.95);
			transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
		}

		#dify-chatbot-bubble-button.dragging::after,
		#dify-chatbot-bubble-button:active::after {
			opacity: 0 !important;
		}

		#dify-chatbot-bubble-button:hover::after {
			opacity: 1;
			transform: translateX(0) scale(1);
		}

		.ruibao-prize {
			position: absolute;
			top: 50%;
			left: 50%;
			font-size: 24px;
			opacity: 0;
			pointer-events: none;
			z-index: -1;
		}

		@keyframes elastic-entry {
			0% {
				transform: translateY(300px) scale(0.5, 1.5);
				opacity: 0;
			}
			40% {
				transform: translateY(-30px) scale(1.1, 0.9);
				opacity: 1;
			}
			60% {
				transform: translateY(10px) scale(0.95, 1.05);
			}
			80% {
				transform: translateY(-5px) scale(1.02, 0.98);
			}
			100% {
				transform: translateY(0) scale(1, 1);
			}
		}

		@keyframes dog-shake-routine {
			0%, 70% { transform: translate(0, 0) rotate(0deg); }
			71% { transform: rotate(-15deg) scale(1.1, 0.9); }
			72% { transform: rotate(15deg) scale(0.9, 1.1); }
			73% { transform: rotate(-12deg) scale(1.1, 0.95); }
			74% { transform: rotate(10deg) scale(0.95, 1.05); }
			75% { transform: rotate(-8deg); }
			76% { transform: rotate(5deg); }
			77%, 100% { transform: rotate(0deg) scale(1); }
		}

		@keyframes fly-out-left {
			0%, 70% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
			71% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
			75% { transform: translate(-80px, -60px) scale(1.2) rotate(-20deg); opacity: 1; }
			85% { transform: translate(-90px, 0px) scale(1) rotate(-45deg); opacity: 0; }
			100% { opacity: 0; }
		}

		@keyframes fly-out-right {
			0%, 71% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
			72% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
			77% { transform: translate(70px, -70px) scale(1.3) rotate(15deg); opacity: 1; }
			87% { transform: translate(80px, -10px) scale(1) rotate(30deg); opacity: 0; }

		}

			73% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
			78% { transform: translate(0px, -90px) scale(1) rotate(180deg); opacity: 1; }

	<!-- 拖拽 + 动效增强版睿宝初始化 -->
	<script>
		function initRuibaoWithPrizes() {
			const checkBtn = setInterval(() => {
				const btn = document.getElementById('dify-chatbot-bubble-button');
				if (btn) {
					clearInterval(checkBtn);

					// 初始位置设为右下角（使用 left/top 便于拖动）
					btn.style.right = 'auto';
					btn.style.bottom = 'auto';
					btn.style.left = (window.innerWidth - 150 - 20) + 'px'; // 150宽 + 20间距
					btn.style.top = (window.innerHeight - 170 - 20) + 'px'; // 170高 + 20间距

					let isDragging = false;
					let offsetX, offsetY;

					// 鼠标按下
					btn.addEventListener('mousedown', (e) => {
						isDragging = true;
						btn.classList.add('dragging');
						const rect = btn.getBoundingClientRect();
						offsetX = e.clientX - rect.left;
						offsetY = e.clientY - rect.top;
						e.preventDefault();
					});

					// 鼠标移动
					document.addEventListener('mousemove', (e) => {
						if (!isDragging) return;
						const x = e.clientX - offsetX;
						const y = e.clientY - offsetY;
						const maxX = window.innerWidth - btn.offsetWidth;
						const maxY = window.innerHeight - btn.offsetHeight;
						btn.style.left = Math.max(0, Math.min(x, maxX)) + 'px';
						btn.style.top = Math.max(0, Math.min(y, maxY)) + 'px';
					});

					// 鼠标松开
					document.addEventListener('mouseup', () => {
						if (!isDragging) return;
						isDragging = false;
						btn.classList.remove('dragging');
						// 恢复抖动动画
						btn.style.animation = 'dog-shake-routine 8s ease-in-out infinite';
					});

					// === 奖励掉落效果 ===
					const items = [
						{ icon: '🥇', anim: 'fly-out-left' },
						{ icon: '🏆', anim: 'fly-out-right' },
						{ icon: '✨', anim: 'fly-out-top' }
					];
					items.forEach(item => {
						const el = document.createElement('div');
						el.className = 'ruibao-prize';
						el.innerText = item.icon;
						el.style.animation = `${item.anim} 8s ease-in-out 1.2s infinite`;
						btn.appendChild(el);
					});
				}
			}, 500);
		}
	</script>

	<!-- 异步加载 Dify SDK 并触发初始化 -->
	<script src="https://ai.raicom.com.cn/embed.min.js" id="JojhBgon1ObyJaSp" defer onload="initRuibaoWithPrizes()"></script>
