name = "ntu-zongce-fetcher"
main = "src/index.js"
compatibility_date = "2024-09-01"

# 每周一 UTC 00:00 = 北京时间周一 08:00 抓取
[triggers]
crons = ["0 0 * * 1"]

# KV 命名空间（部署前先执行:
#   npx wrangler kv namespace create ZC_KV
# 然后把返回的 id 填到下面）
[[kv_namespaces]]
binding = "ZC_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# 可选：手动触发接口的密钥（wrangler secret put TRIGGER_SECRET）
# [vars]
# TRIGGER_SECRET = ""
