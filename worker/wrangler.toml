name = "ntu-zongce-fetcher"
main = "src/index.js"
compatibility_date = "2024-09-01"

# 每天一次（UTC 00:00 = 北京时间 08:00），单次全量抓取全部源
# 手动立即刷新：POST /api/trigger?full=1
[triggers]
crons = ["0 0 * * *"]

# KV 命名空间（部署前先执行:
#   npx wrangler kv namespace create ZC_KV
# 然后把返回的 id 填到下面）
[[kv_namespaces]]
binding = "ZC_KV"
id = "d4feb169c75d41e390916b9415f7c1f6"

# 可选：手动触发接口的密钥（wrangler secret put TRIGGER_SECRET）
# [vars]
# TRIGGER_SECRET = ""
